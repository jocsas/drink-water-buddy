<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // WebKitGTK can't sync per-pixel-transparent windows on X11 reliably
      // (ghost trails); Linux renders an opaque pixel-art card instead.
      if (/Linux/.test(navigator.platform)) document.documentElement.classList.add('card');
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="confetti"></div>

      <div id="bubble" class="hidden">
        <p id="bubble-text">Time to drink water to keep your skin glowing!</p>
        <div id="buttons">
          <button id="yes-btn" class="btn btn-yes">YES, I DRANK</button>
          <button id="snooze-btn" class="btn btn-snooze">SNOOZE</button>
        </div>
        <div id="bubble-tail"></div>
      </div>

      <div id="pet" class="offstage">
        <img id="sprite-idle" src="assets/themes/default/idle.png" alt="" draggable="false" />
        <img id="sprite-drinking" class="hidden" src="assets/themes/default/drinking.png" alt="" draggable="false" />
        <img id="sprite-animated" class="hidden" src="assets/themes/default/idle.png" alt="" draggable="false" />
      </div>
    </div>

    <script src="bridge.js"></script>
    <script src="shared/themes.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
